<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SESSIONS</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap');

:root {
  --bg: #fffdf7;
  --ink: #1a1a1a;
  --ink-muted: #666;
  --accent: #ff6b35;
  --accent-2: #4361ee;
  --accent-3: #7209b7;
  --green: #06d6a0;
  --red: #ef476f;
  --yellow: #ffd166;
  --card-bg: #fff;
  --border: #1a1a1a;
  --border-w: 3px;
  --shadow: 6px 6px 0 #1a1a1a;
  --shadow-sm: 3px 3px 0 #1a1a1a;
  --font: 'Space Grotesk', -apple-system, 'Noto Sans SC', sans-serif;
  --mono: 'Space Mono', 'SF Mono', monospace;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  font-size: 15px;
  line-height: 1.6;
}

.container {
  max-width: 1100px;
  margin: 0 auto;
  padding: 32px 24px;
}

/* Header */
header {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  margin-bottom: 32px;
}

header h1 {
  font-family: var(--mono);
  font-size: 36px;
  font-weight: 700;
  letter-spacing: -1px;
  text-transform: uppercase;
}

header .count-badge {
  font-family: var(--mono);
  font-size: 14px;
  font-weight: 700;
  background: var(--accent);
  color: #fff;
  padding: 4px 14px;
  border: var(--border-w) solid var(--border);
  box-shadow: var(--shadow-sm);
}

/* Tabs */
.tabs {
  display: flex;
  gap: 0;
  margin-bottom: 24px;
}

.tabs button {
  font-family: var(--mono);
  font-size: 13px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1px;
  padding: 10px 24px;
  background: var(--card-bg);
  border: var(--border-w) solid var(--border);
  cursor: pointer;
  transition: all 0.1s;
}

.tabs button:not(:first-child) { border-left: none; }

.tabs button.active {
  background: var(--ink);
  color: var(--bg);
}

.tabs button:hover:not(.active) {
  background: var(--yellow);
}

/* Filters */
.filters {
  display: flex;
  gap: 10px;
  margin-bottom: 24px;
  flex-wrap: wrap;
}

.filters input, .filters select {
  font-family: var(--mono);
  font-size: 13px;
  padding: 8px 12px;
  border: var(--border-w) solid var(--border);
  background: var(--card-bg);
  color: var(--ink);
  outline: none;
}

.filters input:focus, .filters select:focus {
  box-shadow: var(--shadow-sm);
}

.filters input::placeholder { color: #aaa; }
.filters input[type="text"] { flex: 1; min-width: 180px; }
.filters input[type="date"] { width: 155px; }

/* Search */
.search-box {
  display: flex;
  gap: 0;
  margin-bottom: 24px;
}

.search-box input {
  flex: 1;
  font-family: var(--mono);
  font-size: 14px;
  padding: 12px 16px;
  border: var(--border-w) solid var(--border);
  background: var(--card-bg);
  color: var(--ink);
  outline: none;
}

.search-box input:focus { box-shadow: var(--shadow-sm); }
.search-box input::placeholder { color: #aaa; }

.search-box button {
  font-family: var(--mono);
  font-size: 13px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1px;
  padding: 12px 24px;
  background: var(--accent);
  color: #fff;
  border: var(--border-w) solid var(--border);
  border-left: none;
  cursor: pointer;
}

.search-box button:hover { background: #e55a2b; }

/* Session cards */
.session-list { display: flex; flex-direction: column; gap: 14px; }

.session-card {
  background: var(--card-bg);
  border: var(--border-w) solid var(--border);
  box-shadow: var(--shadow);
  padding: 20px 24px;
  cursor: pointer;
  transition: all 0.1s;
  position: relative;
}

.session-card:hover {
  transform: translate(-2px, -2px);
  box-shadow: 8px 8px 0 var(--border);
}

.session-card:active {
  transform: translate(2px, 2px);
  box-shadow: 2px 2px 0 var(--border);
}

.session-card .card-top {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 8px;
}

.session-card .title {
  font-family: var(--font);
  font-size: 18px;
  font-weight: 700;
}

.session-card .date {
  font-family: var(--mono);
  font-size: 12px;
  color: var(--ink-muted);
  white-space: nowrap;
  flex-shrink: 0;
}

.session-card .project {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--ink-muted);
  margin-bottom: 8px;
}

.session-card .summary {
  font-size: 13px;
  color: var(--ink-muted);
  line-height: 1.5;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  margin-bottom: 10px;
}

.tags { display: flex; gap: 6px; flex-wrap: wrap; }

.tag {
  font-family: var(--mono);
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  padding: 3px 10px;
  border: 2px solid var(--border);
  background: var(--yellow);
}

.tag:nth-child(3n+2) { background: #c8f7dc; }
.tag:nth-child(3n) { background: #d4c5f9; }

/* Detail panel */
.detail-panel {
  background: var(--card-bg);
  border: var(--border-w) solid var(--border);
  box-shadow: var(--shadow);
  padding: 28px 32px;
  margin-bottom: 24px;
}

.detail-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  margin-bottom: 20px;
}

.detail-header h2 {
  font-size: 24px;
  font-weight: 700;
  line-height: 1.2;
}

.close-btn {
  font-family: var(--mono);
  font-size: 12px;
  font-weight: 700;
  text-transform: uppercase;
  padding: 6px 14px;
  background: var(--bg);
  border: 2px solid var(--border);
  cursor: pointer;
}

.close-btn:hover { background: var(--red); color: #fff; }

.detail-meta {
  display: flex;
  gap: 20px;
  flex-wrap: wrap;
  font-family: var(--mono);
  font-size: 11px;
  color: var(--ink-muted);
  margin-bottom: 20px;
  padding-bottom: 16px;
  border-bottom: var(--border-w) solid var(--border);
}

.detail-meta strong { color: var(--ink); }

.detail-summary {
  font-size: 14px;
  line-height: 1.7;
  margin-bottom: 20px;
  padding: 16px 20px;
  background: #f0f0e8;
  border: 2px solid var(--border);
}

/* Section blocks */
.section-block {
  margin-bottom: 20px;
}

.section-block h3 {
  font-family: var(--mono);
  font-size: 12px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1.5px;
  margin-bottom: 10px;
  padding: 6px 12px;
  background: var(--ink);
  color: var(--bg);
  display: inline-block;
}

.section-content {
  font-size: 14px;
  line-height: 1.7;
  white-space: pre-wrap;
}

.section-content ul {
  list-style: none;
  padding: 0;
  counter-reset: item;
}

.section-content li {
  padding: 10px 14px 10px 48px;
  margin-bottom: 6px;
  border-left: 5px solid var(--accent);
  background: #faf8f2;
  font-size: 13px;
  line-height: 1.6;
  position: relative;
  counter-increment: item;
}

.section-content li::before {
  content: counter(item, decimal-leading-zero);
  position: absolute;
  left: 12px;
  top: 10px;
  font-family: var(--mono);
  font-size: 11px;
  font-weight: 700;
  color: var(--ink-muted);
}

.section-content li:nth-child(even) { border-left-color: var(--accent-2); }

/* Key learnings categories */
.kl-category {
  margin-bottom: 16px;
}
.kl-category h4 {
  font-family: var(--mono);
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.5px;
  margin-bottom: 8px;
  padding: 4px 10px;
  background: var(--accent-3);
  color: #fff;
  display: inline-block;
}
.kl-category ul {
  counter-reset: item;
}

/* File table */
.file-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
  border: 2px solid var(--border);
}

.file-table th {
  font-family: var(--mono);
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  text-align: left;
  padding: 8px 12px;
  background: var(--ink);
  color: var(--bg);
}

.file-table td {
  padding: 8px 12px;
  border-bottom: 1px solid #ddd;
}

.file-table code {
  font-family: var(--mono);
  font-size: 12px;
  font-weight: 700;
}

/* Search results */
.search-result {
  background: var(--card-bg);
  border: var(--border-w) solid var(--border);
  box-shadow: var(--shadow-sm);
  padding: 18px 22px;
  margin-bottom: 12px;
}

.sr-title {
  font-weight: 700;
  font-size: 16px;
  cursor: pointer;
  margin-bottom: 6px;
}

.sr-title:hover { color: var(--accent); }

.sr-match {
  font-family: var(--mono);
  font-size: 12px;
  padding: 8px 12px;
  margin-top: 6px;
  background: #f0f0e8;
  border-left: 4px solid var(--accent-2);
  color: var(--ink-muted);
}

mark {
  background: var(--yellow);
  color: var(--ink);
  padding: 1px 3px;
  font-weight: 700;
}

.empty {
  text-align: center;
  color: var(--ink-muted);
  padding: 60px 0;
  font-family: var(--mono);
  font-size: 14px;
  text-transform: uppercase;
  letter-spacing: 2px;
}

.loading {
  text-align: center;
  color: var(--ink-muted);
  padding: 30px 0;
  font-family: var(--mono);
}
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>Sessions</h1>
    <div class="count-badge" id="stats">0</div>
  </header>

  <div class="tabs">
    <button class="active" data-tab="browse" onclick="switchTab('browse')">Browse</button>
    <button data-tab="search" onclick="switchTab('search')">Search</button>
  </div>

  <div id="tab-browse">
    <div class="filters">
      <input type="text" id="filter-query" placeholder="FILTER BY TITLE..." oninput="debouncedLoad()">
      <input type="date" id="filter-from" onchange="loadSessions()">
      <input type="date" id="filter-to" onchange="loadSessions()">
      <select id="filter-tag" onchange="loadSessions()">
        <option value="">ALL TAGS</option>
      </select>
    </div>
    <div id="detail-container"></div>
    <div id="session-list" class="session-list"></div>
  </div>

  <div id="tab-search" style="display:none">
    <div class="search-box">
      <input type="text" id="search-input" placeholder="SEARCH SESSIONS..." onkeydown="if(event.key==='Enter')doSearch()">
      <button onclick="doSearch()">GO</button>
    </div>
    <div id="search-results"></div>
  </div>
</div>

<script>
const API = '';
let allTags = new Set();
let debounceTimer = null;

function debouncedLoad() {
  clearTimeout(debounceTimer);
  debounceTimer = setTimeout(loadSessions, 300);
}

function switchTab(tab) {
  document.querySelectorAll('.tabs button').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  document.getElementById('tab-browse').style.display = tab === 'browse' ? '' : 'none';
  document.getElementById('tab-search').style.display = tab === 'search' ? '' : 'none';
  if (tab === 'search') document.getElementById('search-input').focus();
}

async function loadSessions() {
  const params = new URLSearchParams();
  const q = document.getElementById('filter-query').value.trim();
  const from = document.getElementById('filter-from').value;
  const to = document.getElementById('filter-to').value;
  const tag = document.getElementById('filter-tag').value;
  if (q) params.set('query', q);
  if (from) params.set('from', from);
  if (to) params.set('to', to);
  if (tag) params.set('tag', tag);

  const res = await fetch(`${API}/api/sessions?${params}`);
  const data = await res.json();
  renderSessions(data.sessions);
}

function renderSessions(sessions) {
  const el = document.getElementById('session-list');
  document.getElementById('stats').textContent = sessions.length;

  sessions.forEach(s => s.tags.forEach(t => allTags.add(t)));
  updateTagFilter();

  if (!sessions.length) {
    el.innerHTML = '<div class="empty">No sessions found</div>';
    return;
  }

  el.innerHTML = sessions.map(s => `
    <div class="session-card" onclick="showDetail('${s.id}')">
      <div class="card-top">
        <div class="title">${esc(s.title)}</div>
        <div class="date">${s.createdAt.slice(0, 10)}</div>
      </div>
      <div class="project">${esc(s.project)}</div>
      ${s.summary ? `<div class="summary">${esc(s.summary)}</div>` : ''}
      <div class="tags">${s.tags.map(t => `<span class="tag">${esc(t)}</span>`).join('')}</div>
    </div>
  `).join('');
}

function updateTagFilter() {
  const select = document.getElementById('filter-tag');
  const cur = select.value;
  select.innerHTML = '<option value="">ALL TAGS</option>' +
    [...allTags].sort().map(t => `<option value="${esc(t)}"${t===cur?' selected':''}>${esc(t).toUpperCase()}</option>`).join('');
}

async function showDetail(id) {
  const c = document.getElementById('detail-container');
  c.innerHTML = '<div class="loading">LOADING...</div>';

  const res = await fetch(`${API}/api/sessions/${id}`);
  const data = await res.json();
  const s = data.session;
  const sec = s.sections || {};

  const sectionHtml = (t, content) => content ? `<div class="section-block"><h3>${t}</h3><div class="section-content">${content}</div></div>` : '';
  const listHtml = (t, items) => items?.length ? sectionHtml(t, '<ul>' + items.map(i => `<li>${esc(i)}</li>`).join('') + '</ul>') : '';
  const renderKeyLearnings = (kl) => {
    if (!kl) return '';
    if (typeof kl === 'string') return sectionHtml('Key Learnings', esc(kl));
    // Record<string, string[]> — render as categorized list
    const cats = Object.entries(kl).map(([cat, items]) =>
      `<div class="kl-category"><h4>${esc(cat)}</h4><ul>${items.map(i => `<li>${esc(i)}</li>`).join('')}</ul></div>`
    ).join('');
    return sectionHtml('Key Learnings', cats);
  };

  let fileHtml = '';
  if (sec.fileStates?.length) {
    const icon = { 'complete': '\u2713', 'in-progress': '\u270d', 'broken': '\u2717', 'not-started': '\u25cb' };
    const color = { 'complete': 'var(--green)', 'in-progress': 'var(--accent-2)', 'broken': 'var(--red)', 'not-started': 'var(--ink-muted)' };
    fileHtml = sectionHtml('Files', '<table class="file-table"><tr><th>File</th><th>Status</th><th>Notes</th></tr>' +
      sec.fileStates.map(f => `<tr><td><code>${esc(f.path)}</code></td><td style="color:${color[f.status]};font-weight:700">${icon[f.status]||''} ${f.status}</td><td>${esc(f.notes)}</td></tr>`).join('') +
      '</table>');
  }

  c.innerHTML = `
    <div class="detail-panel">
      <div class="detail-header">
        <h2>${esc(s.title)}</h2>
        <button class="close-btn" onclick="closeDetail()">CLOSE</button>
      </div>
      <div class="detail-meta">
        <span>ID: <strong>${s.id.slice(0,8)}</strong></span>
        <span>PROJECT: <strong>${esc(s.project)}</strong></span>
        <span>CREATED: <strong>${s.createdAt.slice(0,10)}</strong></span>
        <span>UPDATED: <strong>${s.updatedAt.slice(0,10)}</strong></span>
      </div>
      <div class="tags" style="margin-bottom:16px">${s.tags.map(t => `<span class="tag">${esc(t)}</span>`).join('')}</div>
      ${sec.whatWeAreBuilding ? `<div class="detail-summary">${esc(sec.whatWeAreBuilding)}</div>` : (s.summary ? `<div class="detail-summary">${esc(s.summary)}</div>` : '')}
      ${listHtml('What Worked', sec.whatWorked)}
      ${listHtml('What Did Not Work', sec.whatDidNotWork)}
      ${listHtml('Not Tried Yet', sec.whatNotTriedYet)}
      ${fileHtml}
      ${listHtml('Decisions', sec.decisions)}
      ${listHtml('Blockers', sec.blockers)}
      ${sectionHtml('Next Step', sec.nextStep ? esc(sec.nextStep) : '')}
      ${renderKeyLearnings(sec.keyLearnings)}
    </div>
  `;
  c.scrollIntoView({ behavior: 'smooth' });
}

function closeDetail() {
  document.getElementById('detail-container').innerHTML = '';
}

async function doSearch() {
  const q = document.getElementById('search-input').value.trim();
  if (!q) return;
  const c = document.getElementById('search-results');
  c.innerHTML = '<div class="loading">SEARCHING...</div>';

  const res = await fetch(`${API}/api/search?q=${encodeURIComponent(q)}`);
  const data = await res.json();

  if (!data.results.length) {
    c.innerHTML = '<div class="empty">No matches</div>';
    return;
  }

  c.innerHTML = data.results.map(r => `
    <div class="search-result">
      <div class="sr-title" onclick="switchTab('browse');showDetail('${r.session.id}')">${esc(r.session.title)} <span style="color:var(--ink-muted);font-weight:400;font-size:12px">(${r.matches.length})</span></div>
      <div style="font-family:var(--mono);font-size:11px;color:var(--ink-muted);margin-bottom:6px">${r.session.createdAt.slice(0,10)} / ${esc(r.session.project)}</div>
      ${r.matches.slice(0,3).map(m => `<div class="sr-match"><strong>${m.role}:</strong> ${highlight(esc(m.snippet), q)}</div>`).join('')}
    </div>
  `).join('');
}

function highlight(text, query) {
  if (!query) return text;
  return text.replace(new RegExp(`(${query.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')})`, 'gi'), '<mark>$1</mark>');
}

function esc(s) {
  return s ? s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;') : '';
}

loadSessions();
</script>
</body>
</html>
