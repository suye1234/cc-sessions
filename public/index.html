<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SESSIONS</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap');

:root {
  --bg: #fffdf7;
  --ink: #1a1a1a;
  --ink-muted: #666;
  --accent: #ff6b35;
  --accent-2: #4361ee;
  --accent-3: #7209b7;
  --green: #06d6a0;
  --red: #ef476f;
  --yellow: #ffd166;
  --card-bg: #fff;
  --border: #1a1a1a;
  --border-w: 3px;
  --shadow: 6px 6px 0 #1a1a1a;
  --shadow-sm: 3px 3px 0 #1a1a1a;
  --font: 'Space Grotesk', -apple-system, 'Noto Sans SC', sans-serif;
  --mono: 'Space Mono', 'SF Mono', monospace;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  font-size: 15px;
  line-height: 1.6;
}

.container {
  max-width: 1100px;
  margin: 0 auto;
  padding: 32px 24px;
}

/* Header */
header {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  margin-bottom: 32px;
}

header h1 {
  font-family: var(--mono);
  font-size: 36px;
  font-weight: 700;
  letter-spacing: -1px;
  text-transform: uppercase;
}

header .count-badge {
  font-family: var(--mono);
  font-size: 14px;
  font-weight: 700;
  background: var(--accent);
  color: #fff;
  padding: 4px 14px;
  border: var(--border-w) solid var(--border);
  box-shadow: var(--shadow-sm);
}

/* Tabs */
.tabs {
  display: flex;
  gap: 0;
  margin-bottom: 24px;
}

.tabs button {
  font-family: var(--mono);
  font-size: 13px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1px;
  padding: 10px 24px;
  background: var(--card-bg);
  border: var(--border-w) solid var(--border);
  cursor: pointer;
  transition: all 0.1s;
}

.tabs button:not(:first-child) { border-left: none; }

.tabs button.active {
  background: var(--ink);
  color: var(--bg);
}

.tabs button:hover:not(.active) {
  background: var(--yellow);
}

/* Filters */
.filters {
  display: flex;
  gap: 10px;
  margin-bottom: 24px;
  flex-wrap: wrap;
}

.filters input, .filters select {
  font-family: var(--mono);
  font-size: 13px;
  padding: 8px 12px;
  border: var(--border-w) solid var(--border);
  background: var(--card-bg);
  color: var(--ink);
  outline: none;
}

.filters input:focus, .filters select:focus {
  box-shadow: var(--shadow-sm);
}

.filters input::placeholder { color: #aaa; }
.filters input[type="text"] { flex: 1; min-width: 180px; }
.filters input[type="date"] { width: 155px; }

/* Search */
.search-box {
  display: flex;
  gap: 0;
  margin-bottom: 24px;
}

.search-box input {
  flex: 1;
  font-family: var(--mono);
  font-size: 14px;
  padding: 12px 16px;
  border: var(--border-w) solid var(--border);
  background: var(--card-bg);
  color: var(--ink);
  outline: none;
}

.search-box input:focus { box-shadow: var(--shadow-sm); }
.search-box input::placeholder { color: #aaa; }

.search-box button {
  font-family: var(--mono);
  font-size: 13px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1px;
  padding: 12px 24px;
  background: var(--accent);
  color: #fff;
  border: var(--border-w) solid var(--border);
  border-left: none;
  cursor: pointer;
}

.search-box button:hover { background: #e55a2b; }

/* Session cards */
.session-list { display: flex; flex-direction: column; gap: 14px; }

.session-card {
  background: var(--card-bg);
  border: var(--border-w) solid var(--border);
  box-shadow: var(--shadow);
  padding: 20px 24px;
  cursor: pointer;
  transition: all 0.1s;
  position: relative;
}

.session-card:hover {
  transform: translate(-2px, -2px);
  box-shadow: 8px 8px 0 var(--border);
}

.session-card:active {
  transform: translate(2px, 2px);
  box-shadow: 2px 2px 0 var(--border);
}

.session-card .card-top {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 8px;
}

.session-card .title {
  font-family: var(--font);
  font-size: 18px;
  font-weight: 700;
}

.session-card .date {
  font-family: var(--mono);
  font-size: 12px;
  color: var(--ink-muted);
  white-space: nowrap;
  flex-shrink: 0;
}

.session-card .project {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--ink-muted);
  margin-bottom: 8px;
}

.session-card .summary {
  font-size: 13px;
  color: var(--ink-muted);
  line-height: 1.5;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  margin-bottom: 10px;
}

.tags { display: flex; gap: 6px; flex-wrap: wrap; }

.tag {
  font-family: var(--mono);
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  padding: 3px 10px;
  border: 2px solid var(--border);
  background: var(--yellow);
}

.tag:nth-child(3n+2) { background: #c8f7dc; }
.tag:nth-child(3n) { background: #d4c5f9; }

/* Detail panel */
.detail-container {
  overflow: hidden;
  transition: max-height 0.3s ease, opacity 0.3s ease;
  max-height: 0;
  opacity: 0;
}

.detail-container.open {
  max-height: 5000px;
  opacity: 1;
}

.detail-panel {
  background: var(--card-bg);
  border: var(--border-w) solid var(--border);
  box-shadow: var(--shadow);
  padding: 28px 32px;
  margin-bottom: 24px;
}

.detail-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  margin-bottom: 20px;
  gap: 10px;
}

.detail-header h2 {
  font-size: 24px;
  font-weight: 700;
  line-height: 1.2;
  flex: 1;
}

.btn-group { display: flex; gap: 6px; flex-shrink: 0; }

.close-btn, .edit-btn, .save-btn, .cancel-btn {
  font-family: var(--mono);
  font-size: 12px;
  font-weight: 700;
  text-transform: uppercase;
  padding: 6px 14px;
  background: var(--bg);
  border: 2px solid var(--border);
  cursor: pointer;
}

.close-btn:hover { background: var(--red); color: #fff; }
.edit-btn { border-color: var(--accent-2); color: var(--accent-2); }
.edit-btn:hover { background: var(--accent-2); color: #fff; }
.save-btn { background: var(--green); color: #fff; border-color: var(--green); }
.save-btn:hover { background: #05b88a; }
.cancel-btn:hover { background: #eee; }

.delete-btn {
  font-family: var(--mono);
  font-size: 12px;
  font-weight: 700;
  text-transform: uppercase;
  padding: 6px 14px;
  background: var(--bg);
  border: 2px solid var(--red);
  color: var(--red);
  cursor: pointer;
}
.delete-btn:hover { background: var(--red); color: #fff; }

.detail-meta {
  display: flex;
  gap: 20px;
  flex-wrap: wrap;
  font-family: var(--mono);
  font-size: 11px;
  color: var(--ink-muted);
  margin-bottom: 20px;
  padding-bottom: 16px;
  border-bottom: var(--border-w) solid var(--border);
}

.detail-meta strong { color: var(--ink); }

.detail-summary {
  font-size: 14px;
  line-height: 1.7;
  margin-bottom: 20px;
  padding: 16px 20px;
  background: #f0f0e8;
  border: 2px solid var(--border);
}

/* Section blocks */
.section-block { margin-bottom: 20px; }

.section-block h3 {
  font-family: var(--mono);
  font-size: 12px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1.5px;
  margin-bottom: 10px;
  padding: 6px 12px;
  background: var(--ink);
  color: var(--bg);
  display: inline-block;
}

.section-content {
  font-size: 14px;
  line-height: 1.7;
  white-space: pre-wrap;
}

.section-content ul {
  list-style: none;
  padding: 0;
  counter-reset: item;
}

.section-content li {
  padding: 10px 14px 10px 48px;
  margin-bottom: 6px;
  border-left: 5px solid var(--accent);
  background: #faf8f2;
  font-size: 13px;
  line-height: 1.6;
  position: relative;
  counter-increment: item;
}

.section-content li::before {
  content: counter(item, decimal-leading-zero);
  position: absolute;
  left: 12px;
  top: 10px;
  font-family: var(--mono);
  font-size: 11px;
  font-weight: 700;
  color: var(--ink-muted);
}

.section-content li:nth-child(even) { border-left-color: var(--accent-2); }

/* Edit mode list items */
.section-content li .item-delete {
  position: absolute;
  right: 8px;
  top: 8px;
  font-size: 14px;
  color: var(--red);
  cursor: pointer;
  display: none;
  font-weight: 700;
  line-height: 1;
  padding: 2px 6px;
}
.section-content li .item-delete:hover { background: var(--red); color: #fff; }

.edit-mode .section-content li .item-delete { display: block; }

.add-item-row {
  display: none;
  gap: 0;
  margin-top: 6px;
}

.edit-mode .add-item-row { display: flex; }

.add-item-row input {
  flex: 1;
  font-family: var(--font);
  font-size: 13px;
  padding: 8px 12px;
  border: 2px solid var(--border);
  outline: none;
}

.add-item-row button {
  font-family: var(--mono);
  font-size: 13px;
  font-weight: 700;
  padding: 8px 16px;
  background: var(--green);
  color: #fff;
  border: 2px solid var(--border);
  border-left: none;
  cursor: pointer;
}

/* Editable fields */
.edit-input {
  font-family: var(--font);
  font-size: inherit;
  font-weight: inherit;
  width: 100%;
  padding: 4px 8px;
  border: 2px solid var(--accent-2);
  background: #f8f8ff;
  outline: none;
}

.edit-textarea {
  font-family: var(--font);
  font-size: 14px;
  width: 100%;
  min-height: 60px;
  padding: 8px 12px;
  border: 2px solid var(--accent-2);
  background: #f8f8ff;
  outline: none;
  resize: vertical;
}

/* Key learnings categories */
.kl-category { margin-bottom: 16px; }
.kl-category h4 {
  font-family: var(--mono);
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.5px;
  margin-bottom: 8px;
  padding: 4px 10px;
  background: var(--accent-3);
  color: #fff;
  display: inline-block;
}
.kl-category ul { counter-reset: item; }

/* File table */
.file-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
  border: 2px solid var(--border);
}

.file-table th {
  font-family: var(--mono);
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  text-align: left;
  padding: 8px 12px;
  background: var(--ink);
  color: var(--bg);
}

.file-table td {
  padding: 8px 12px;
  border-bottom: 1px solid #ddd;
}

.file-table code {
  font-family: var(--mono);
  font-size: 12px;
  font-weight: 700;
}

/* Search results */
.search-result {
  background: var(--card-bg);
  border: var(--border-w) solid var(--border);
  box-shadow: var(--shadow-sm);
  padding: 18px 22px;
  margin-bottom: 12px;
}

.sr-title {
  font-weight: 700;
  font-size: 16px;
  cursor: pointer;
  margin-bottom: 6px;
}

.sr-title:hover { color: var(--accent); }

.sr-match {
  font-family: var(--mono);
  font-size: 12px;
  padding: 8px 12px;
  margin-top: 6px;
  background: #f0f0e8;
  border-left: 4px solid var(--accent-2);
  color: var(--ink-muted);
}

mark {
  background: var(--yellow);
  color: var(--ink);
  padding: 1px 3px;
  font-weight: 700;
}

/* Pagination */
.pagination {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 8px;
  margin-top: 24px;
  font-family: var(--mono);
  font-size: 13px;
}

.pagination button {
  font-family: var(--mono);
  font-size: 12px;
  font-weight: 700;
  padding: 6px 14px;
  border: 2px solid var(--border);
  background: var(--card-bg);
  cursor: pointer;
}

.pagination button:hover { background: var(--yellow); }
.pagination button:disabled { opacity: 0.3; cursor: default; }
.pagination button:disabled:hover { background: var(--card-bg); }
.pagination .page-info { font-weight: 700; }

/* Digest tab */
.digest-header {
  background: var(--card-bg);
  border: var(--border-w) solid var(--border);
  box-shadow: var(--shadow);
  padding: 24px 28px;
  margin-bottom: 24px;
}

.digest-header h2 {
  font-size: 22px;
  font-weight: 700;
  margin-bottom: 8px;
}

.digest-meta {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--ink-muted);
  display: flex;
  gap: 20px;
  flex-wrap: wrap;
}

.digest-meta strong { color: var(--ink); }

.digest-section {
  background: var(--card-bg);
  border: var(--border-w) solid var(--border);
  box-shadow: var(--shadow-sm);
  padding: 20px 24px;
  margin-bottom: 16px;
}

.digest-section h3 {
  font-family: var(--mono);
  font-size: 12px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1.5px;
  margin-bottom: 14px;
  padding: 6px 12px;
  background: var(--ink);
  color: var(--bg);
  display: inline-block;
}

/* Timeline */
.timeline { position: relative; padding-left: 24px; }

.timeline::before {
  content: '';
  position: absolute;
  left: 8px;
  top: 0;
  bottom: 0;
  width: 3px;
  background: var(--accent-2);
}

.timeline-item {
  position: relative;
  margin-bottom: 16px;
  padding: 12px 16px;
  background: #faf8f2;
  border: 2px solid #e0e0d8;
  font-size: 13px;
  line-height: 1.6;
}

.timeline-item::before {
  content: '';
  position: absolute;
  left: -22px;
  top: 16px;
  width: 12px;
  height: 12px;
  background: var(--accent-2);
  border: 2px solid var(--border);
  border-radius: 50%;
}

.timeline-date {
  font-family: var(--mono);
  font-size: 11px;
  font-weight: 700;
  color: var(--ink-muted);
  margin-bottom: 4px;
}

/* Decision status */
.decision-item {
  padding: 10px 14px;
  margin-bottom: 6px;
  border-left: 5px solid var(--green);
  background: #faf8f2;
  font-size: 13px;
  line-height: 1.6;
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 12px;
}

.decision-item.reversed { border-left-color: var(--red); opacity: 0.6; text-decoration: line-through; }
.decision-item.superseded { border-left-color: var(--ink-muted); opacity: 0.5; }

.decision-date {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--ink-muted);
  white-space: nowrap;
  flex-shrink: 0;
}

/* Lesson bar */
.lesson-item {
  margin-bottom: 8px;
}

.lesson-bar {
  height: 6px;
  background: var(--red);
  margin-bottom: 4px;
  transition: width 0.3s;
}

.lesson-text {
  font-size: 13px;
  line-height: 1.5;
}

.lesson-freq {
  font-family: var(--mono);
  font-size: 11px;
  font-weight: 700;
  color: var(--red);
  margin-right: 6px;
}

/* Collapsible */
.collapsible-header {
  cursor: pointer;
  user-select: none;
}

.collapsible-header::after {
  content: ' +';
  font-family: var(--mono);
}

.collapsible-header.open::after {
  content: ' -';
}

.collapsible-body {
  max-height: 0;
  overflow: hidden;
  transition: max-height 0.3s ease;
}

.collapsible-body.open {
  max-height: 2000px;
}

.empty {
  text-align: center;
  color: var(--ink-muted);
  padding: 60px 0;
  font-family: var(--mono);
  font-size: 14px;
  text-transform: uppercase;
  letter-spacing: 2px;
}

.loading {
  text-align: center;
  color: var(--ink-muted);
  padding: 30px 0;
  font-family: var(--mono);
}

/* Responsive */
@media (max-width: 640px) {
  .container { padding: 16px 12px; }
  header h1 { font-size: 24px; }
  .tabs button { padding: 8px 14px; font-size: 11px; }
  .filters { flex-direction: column; }
  .filters input[type="date"] { width: 100%; }
  .detail-panel { padding: 16px; }
  .detail-header { flex-direction: column; }
  .detail-header h2 { font-size: 18px; }
  .session-card { padding: 14px 16px; }
  .session-card .title { font-size: 15px; }
  .digest-header { padding: 16px; }
  .digest-section { padding: 14px 16px; }
  .digest-meta { flex-direction: column; gap: 4px; }
}
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>Sessions</h1>
    <div class="count-badge" id="stats">0</div>
  </header>

  <div class="tabs">
    <button class="active" data-tab="browse" onclick="switchTab('browse')">Browse</button>
    <button data-tab="search" onclick="switchTab('search')">Search</button>
    <button data-tab="digest" onclick="switchTab('digest')">Digest</button>
  </div>

  <div id="tab-browse">
    <div class="filters">
      <input type="text" id="filter-query" placeholder="FILTER BY TITLE..." oninput="debouncedLoad()">
      <input type="date" id="filter-from" onchange="loadSessions()">
      <input type="date" id="filter-to" onchange="loadSessions()">
      <select id="filter-tag" onchange="loadSessions()">
        <option value="">ALL TAGS</option>
      </select>
      <select id="filter-sort" onchange="loadSessions()">
        <option value="updated">UPDATED</option>
        <option value="created">CREATED</option>
        <option value="title">TITLE</option>
      </select>
    </div>
    <div id="session-list" class="session-list"></div>
    <div id="pagination" class="pagination"></div>
  </div>

  <div id="tab-search" style="display:none">
    <div class="search-box">
      <input type="text" id="search-input" placeholder="SEARCH SESSIONS..." onkeydown="if(event.key==='Enter')doSearch()">
      <button onclick="doSearch()">GO</button>
    </div>
    <div id="search-results"></div>
  </div>

  <div id="tab-digest" style="display:none">
    <div id="digest-content"></div>
  </div>
</div>

<script>
const API = '';
let allTags = new Set();
let allSessions = [];
let currentPage = 1;
const PAGE_SIZE = 20;
let debounceTimer = null;
let editState = null; // { id, session } when editing

function debouncedLoad() {
  clearTimeout(debounceTimer);
  debounceTimer = setTimeout(loadSessions, 300);
}

function switchTab(tab) {
  document.querySelectorAll('.tabs button').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  document.getElementById('tab-browse').style.display = tab === 'browse' ? '' : 'none';
  document.getElementById('tab-search').style.display = tab === 'search' ? '' : 'none';
  document.getElementById('tab-digest').style.display = tab === 'digest' ? '' : 'none';
  if (tab === 'search') document.getElementById('search-input').focus();
  if (tab === 'digest') loadDigest();
}

// ── Browse ──

async function loadSessions() {
  const params = new URLSearchParams();
  const q = document.getElementById('filter-query').value.trim();
  const from = document.getElementById('filter-from').value;
  const to = document.getElementById('filter-to').value;
  const tag = document.getElementById('filter-tag').value;
  if (q) params.set('query', q);
  if (from) params.set('from', from);
  if (to) params.set('to', to);
  if (tag) params.set('tag', tag);

  const res = await fetch(`${API}/api/sessions?${params}`);
  const data = await res.json();
  allSessions = sortSessions(data.sessions);
  currentPage = 1;
  renderPage();
}

function sortSessions(sessions) {
  const sort = document.getElementById('filter-sort').value;
  return [...sessions].sort((a, b) => {
    if (sort === 'title') return a.title.localeCompare(b.title);
    if (sort === 'created') return b.createdAt.localeCompare(a.createdAt);
    return b.updatedAt.localeCompare(a.updatedAt);
  });
}

function renderPage() {
  const sessions = allSessions;
  document.getElementById('stats').textContent = sessions.length;
  sessions.forEach(s => s.tags.forEach(t => allTags.add(t)));
  updateTagFilter();

  const total = sessions.length;
  const totalPages = Math.max(1, Math.ceil(total / PAGE_SIZE));
  if (currentPage > totalPages) currentPage = totalPages;
  const start = (currentPage - 1) * PAGE_SIZE;
  const page = sessions.slice(start, start + PAGE_SIZE);

  renderSessions(page);
  renderPagination(totalPages);
}

function renderSessions(sessions) {
  const el = document.getElementById('session-list');
  if (!sessions.length) {
    el.innerHTML = '<div class="empty">No sessions found</div>';
    return;
  }

  el.innerHTML = sessions.map(s => `
    <div class="session-card" data-id="${s.id}" onclick="showDetail('${s.id}')">
      <div class="card-top">
        <div class="title">${esc(s.title)}</div>
        <div class="date">${s.createdAt.slice(0, 10)}</div>
      </div>
      <div class="project">${esc(s.project)}</div>
      ${s.summary ? `<div class="summary">${esc(s.summary)}</div>` : ''}
      <div class="tags">${s.tags.map(t => `<span class="tag">${esc(t)}</span>`).join('')}</div>
    </div>
  `).join('');
}

function renderPagination(totalPages) {
  const el = document.getElementById('pagination');
  if (totalPages <= 1) { el.innerHTML = ''; return; }
  el.innerHTML = `
    <button onclick="goPage(${currentPage - 1})" ${currentPage <= 1 ? 'disabled' : ''}>PREV</button>
    <span class="page-info">${currentPage} / ${totalPages}</span>
    <button onclick="goPage(${currentPage + 1})" ${currentPage >= totalPages ? 'disabled' : ''}>NEXT</button>
  `;
}

function goPage(p) {
  currentPage = p;
  renderPage();
  closeDetail();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function updateTagFilter() {
  const select = document.getElementById('filter-tag');
  const cur = select.value;
  select.innerHTML = '<option value="">ALL TAGS</option>' +
    [...allTags].sort().map(t => `<option value="${esc(t)}"${t===cur?' selected':''}>${esc(t).toUpperCase()}</option>`).join('');
}

// ── Detail ──

async function showDetail(id) {
  const card = document.querySelector(`.session-card[data-id="${id}"]`);
  if (!card) return;

  const existing = card.nextElementSibling;
  if (existing && existing.classList.contains('detail-container')) {
    existing.remove();
    return;
  }

  closeDetail();
  editState = null;

  const c = document.createElement('div');
  c.className = 'detail-container';
  c.innerHTML = '<div class="loading">LOADING...</div>';
  card.after(c);

  const res = await fetch(`${API}/api/sessions/${id}`);
  const data = await res.json();
  const s = data.session;

  renderDetail(c, s, false);
  requestAnimationFrame(() => c.classList.add('open'));
}

function renderDetail(container, s, editing) {
  const sec = s.sections || {};

  const sectionHtml = (t, content) => content ? `<div class="section-block"><h3>${t}</h3><div class="section-content">${content}</div></div>` : '';

  const listHtml = (title, items, key) => {
    if (!items?.length && !editing) return '';
    const lis = (items || []).map((item, i) => `<li>${esc(item)}${editing ? `<span class="item-delete" onclick="removeItem('${key}',${i})">x</span>` : ''}</li>`).join('');
    const addRow = `<div class="add-item-row"><input type="text" placeholder="Add item..." onkeydown="if(event.key==='Enter')addItem('${key}',this)"><button onclick="addItem('${key}',this.previousElementSibling)">+</button></div>`;
    return `<div class="section-block"><h3>${title}</h3><div class="section-content"><ul>${lis}</ul>${addRow}</div></div>`;
  };

  const renderKeyLearnings = (kl) => {
    if (!kl) return '';
    if (typeof kl === 'string') return sectionHtml('Key Learnings', esc(kl));
    const cats = Object.entries(kl).map(([cat, items]) =>
      `<div class="kl-category"><h4>${esc(cat)}</h4><ul>${items.map(i => `<li>${esc(i)}</li>`).join('')}</ul></div>`
    ).join('');
    return sectionHtml('Key Learnings', cats);
  };

  let fileHtml = '';
  if (sec.fileStates?.length) {
    const icon = { 'complete': '\u2713', 'in-progress': '\u270d', 'broken': '\u2717', 'not-started': '\u25cb' };
    const color = { 'complete': 'var(--green)', 'in-progress': 'var(--accent-2)', 'broken': 'var(--red)', 'not-started': 'var(--ink-muted)' };
    fileHtml = sectionHtml('Files', '<table class="file-table"><tr><th>File</th><th>Status</th><th>Notes</th></tr>' +
      sec.fileStates.map(f => `<tr><td><code>${esc(f.path)}</code></td><td style="color:${color[f.status]};font-weight:700">${icon[f.status]||''} ${f.status}</td><td>${esc(f.notes)}</td></tr>`).join('') +
      '</table>');
  }

  const titleHtml = editing
    ? `<input class="edit-input" style="font-size:24px;font-weight:700" value="${esc(s.title)}" data-field="title">`
    : `<h2>${esc(s.title)}</h2>`;

  const tagsHtml = editing
    ? `<input class="edit-input" style="font-size:12px" value="${s.tags.join(', ')}" data-field="tags">`
    : `<div class="tags" style="margin-bottom:16px">${s.tags.map(t => `<span class="tag">${esc(t)}</span>`).join('')}</div>`;

  const nextStepHtml = editing
    ? `<div class="section-block"><h3>Next Step</h3><textarea class="edit-textarea" data-field="nextStep">${esc(sec.nextStep || '')}</textarea></div>`
    : sectionHtml('Next Step', sec.nextStep ? esc(sec.nextStep) : '');

  const btns = editing
    ? `<div class="btn-group"><button class="save-btn" onclick="saveEdit('${s.id}')">SAVE</button><button class="cancel-btn" onclick="cancelEdit('${s.id}')">CANCEL</button></div>`
    : `<div class="btn-group"><button class="edit-btn" onclick="startEdit('${s.id}')">EDIT</button><button class="delete-btn" onclick="deleteSession('${s.id}')">DELETE</button><button class="close-btn" onclick="closeDetail()">CLOSE</button></div>`;

  container.innerHTML = `
    <div class="detail-panel ${editing ? 'edit-mode' : ''}">
      <div class="detail-header">
        ${titleHtml}
        ${btns}
      </div>
      <div class="detail-meta">
        <span>ID: <strong>${s.id.slice(0,8)}</strong></span>
        <span>PROJECT: <strong>${esc(s.project)}</strong></span>
        <span>CREATED: <strong>${s.createdAt.slice(0,10)}</strong></span>
        <span>UPDATED: <strong>${s.updatedAt.slice(0,10)}</strong></span>
      </div>
      ${tagsHtml}
      ${sec.whatWeAreBuilding ? `<div class="detail-summary">${esc(sec.whatWeAreBuilding)}</div>` : (s.summary ? `<div class="detail-summary">${esc(s.summary)}</div>` : '')}
      ${listHtml('What Worked', sec.whatWorked, 'whatWorked')}
      ${listHtml('What Did Not Work', sec.whatDidNotWork, 'whatDidNotWork')}
      ${listHtml('Not Tried Yet', sec.whatNotTriedYet, 'whatNotTriedYet')}
      ${fileHtml}
      ${listHtml('Decisions', sec.decisions, 'decisions')}
      ${listHtml('Blockers', sec.blockers, 'blockers')}
      ${nextStepHtml}
      ${renderKeyLearnings(sec.keyLearnings)}
    </div>
  `;
}

function closeDetail() {
  document.querySelectorAll('.detail-container').forEach(el => el.remove());
  editState = null;
}

// ── Edit ──

async function startEdit(id) {
  const res = await fetch(`${API}/api/sessions/${id}`);
  const data = await res.json();
  editState = { id, session: JSON.parse(JSON.stringify(data.session)) };
  const container = document.querySelector('.detail-container');
  if (container) renderDetail(container, editState.session, true);
}

function cancelEdit(id) {
  editState = null;
  showDetail(id);
}

function removeItem(key, index) {
  if (!editState) return;
  const items = editState.session.sections[key];
  if (items) {
    items.splice(index, 1);
    const container = document.querySelector('.detail-container');
    if (container) renderDetail(container, editState.session, true);
  }
}

function addItem(key, input) {
  if (!editState || !input.value.trim()) return;
  if (!editState.session.sections[key]) editState.session.sections[key] = [];
  editState.session.sections[key].push(input.value.trim());
  input.value = '';
  const container = document.querySelector('.detail-container');
  if (container) renderDetail(container, editState.session, true);
}

async function saveEdit(id) {
  if (!editState) return;
  const panel = document.querySelector('.detail-panel');
  const titleInput = panel.querySelector('[data-field="title"]');
  const tagsInput = panel.querySelector('[data-field="tags"]');
  const nextStepInput = panel.querySelector('[data-field="nextStep"]');

  const patch = {};
  if (titleInput) patch.title = titleInput.value.trim();
  if (tagsInput) patch.tags = tagsInput.value.split(',').map(t => t.trim()).filter(Boolean);
  patch.sections = { ...editState.session.sections };
  if (nextStepInput) patch.sections.nextStep = nextStepInput.value.trim();

  await fetch(`${API}/api/sessions/${id}`, {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(patch),
  });

  editState = null;
  closeDetail();
  await loadSessions();
  showDetail(id);
}

async function deleteSession(id) {
  if (!confirm('确定要删除这个 session 吗？此操作不可撤销。')) return;
  await fetch(`${API}/api/sessions/${id}`, { method: 'DELETE' });
  closeDetail();
  loadSessions();
}

// ── Search ──

async function doSearch() {
  const q = document.getElementById('search-input').value.trim();
  if (!q) return;
  const c = document.getElementById('search-results');
  c.innerHTML = '<div class="loading">SEARCHING...</div>';

  const res = await fetch(`${API}/api/search?q=${encodeURIComponent(q)}`);
  const data = await res.json();

  if (!data.results.length) {
    c.innerHTML = '<div class="empty">No matches</div>';
    return;
  }

  c.innerHTML = data.results.map(r => `
    <div class="search-result">
      <div class="sr-title" onclick="switchTab('browse');showDetail('${r.session.id}')">${esc(r.session.title)} <span style="color:var(--ink-muted);font-weight:400;font-size:12px">(${r.matches.length})</span></div>
      <div style="font-family:var(--mono);font-size:11px;color:var(--ink-muted);margin-bottom:6px">${r.session.createdAt.slice(0,10)} / ${esc(r.session.project)}</div>
      ${r.matches.slice(0,3).map(m => `<div class="sr-match"><strong>${m.role}:</strong> ${highlight(esc(m.snippet), q)}</div>`).join('')}
    </div>
  `).join('');
}

// ── Digest ──

async function loadDigest() {
  const c = document.getElementById('digest-content');
  c.innerHTML = '<div class="loading">LOADING DIGEST...</div>';

  const res = await fetch(`${API}/api/digest`);
  const data = await res.json();

  if (!data.digest) {
    c.innerHTML = '<div class="empty">No digest found. Run: sessions digest generate &lt;project-name&gt;</div>';
    return;
  }

  const d = data.digest;
  const maxFreq = d.hardLessons.length ? Math.max(...d.hardLessons.map(l => l.frequency)) : 1;

  const decisionsHtml = d.decisions.map(dec => {
    const cls = dec.status !== 'active' ? dec.status : '';
    return `<div class="decision-item ${cls}"><span>${esc(dec.decision)}</span><span class="decision-date">${dec.date}</span></div>`;
  }).join('');

  const lessonsHtml = d.hardLessons.slice(0, 20).map(l => {
    const width = Math.max(10, (l.frequency / maxFreq) * 100);
    return `<div class="lesson-item"><div class="lesson-bar" style="width:${width}%"></div><div class="lesson-text"><span class="lesson-freq">${l.frequency}x</span>${esc(l.lesson)}</div></div>`;
  }).join('');

  const timelineHtml = d.architecture.evolution.slice(-10).reverse().map(e =>
    `<div class="timeline-item"><div class="timeline-date">${e.date} / ${e.sessionId}</div>${esc(e.description)}</div>`
  ).join('');

  const learningsHtml = d.keyLearnings.map(kl =>
    `<div class="kl-category">
      <h4 class="collapsible-header" onclick="toggleCollapse(this)">${esc(kl.category)} (${kl.items.length})</h4>
      <div class="collapsible-body"><ul>${kl.items.map(i => `<li>${esc(i)}</li>`).join('')}</ul></div>
    </div>`
  ).join('');

  c.innerHTML = `
    <div class="digest-header">
      <h2>${esc(d.projectName)}</h2>
      <div class="digest-meta">
        <span>PATH: <strong>${esc(d.projectPath)}</strong></span>
        <span>UPDATED: <strong>${d.lastUpdated.slice(0,10)}</strong></span>
        <span>SESSIONS: <strong>${d.sessionCount}</strong></span>
      </div>
    </div>

    ${d.architecture.current ? `
    <div class="digest-section">
      <h3>Architecture</h3>
      <div style="font-size:14px;line-height:1.7;margin-bottom:20px">${esc(d.architecture.current)}</div>
      ${timelineHtml ? `<h3>Evolution</h3><div class="timeline">${timelineHtml}</div>` : ''}
    </div>` : ''}

    ${decisionsHtml ? `
    <div class="digest-section">
      <h3>Decisions (${d.decisions.length})</h3>
      ${decisionsHtml}
    </div>` : ''}

    ${lessonsHtml ? `
    <div class="digest-section">
      <h3>Hard Lessons (${d.hardLessons.length})</h3>
      ${lessonsHtml}
    </div>` : ''}

    ${learningsHtml ? `
    <div class="digest-section">
      <h3>Key Learnings</h3>
      ${learningsHtml}
    </div>` : ''}

    ${d.nextSteps.length ? `
    <div class="digest-section">
      <h3>Next Steps</h3>
      <ul class="section-content">${d.nextSteps.map(s => `<li>${esc(s)}</li>`).join('')}</ul>
    </div>` : ''}
  `;
}

function toggleCollapse(header) {
  header.classList.toggle('open');
  const body = header.nextElementSibling;
  if (body) body.classList.toggle('open');
}

// ── Helpers ──

function highlight(text, query) {
  if (!query) return text;
  return text.replace(new RegExp(`(${query.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')})`, 'gi'), '<mark>$1</mark>');
}

function esc(s) {
  return s ? s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;') : '';
}

loadSessions();
</script>
</body>
</html>
